-->
<div class="payment-method" data-bind="css: {'_active': (getCode() == isChecked())}">
    <div class="payment-method-title field choice">
        <input type="radio"
               name="payment[method]"
               class="radio"
               data-bind="attr: {'id': getCode()}, value: getCode(), checked: isChecked, click: selectPaymentMethod, visible: isRadioButtonVisible()"/>
        <div class="aplazo-banner-checkout">
            <img data-bind="attr: {alt: 'Aplazo Banner', src: getBannerUrl()}" class="payment-banner-checkout"
                 width="80" height="21"/>
        </div>
        <label class="aplazo-title label" data-bind="attr: {'for': getCode()}">
            <!-- Aplazo Title -->
            <span data-bind="text: getTitle()"></span>
        </label>
    </div>

    <div class="payment-method-content">
        <!-- ko foreach: getRegion('messages') -->
        <!-- ko template: getTemplate() --><!-- /ko -->
        <!--/ko-->


        <div class="payment-method-billing-address">
            <!-- ko foreach: $parent.getRegion(getBillingAddressFormName()) -->
            <!-- ko template: getTemplate() --><!-- /ko -->
            <!--/ko-->
        </div>

        <div class="checkout-agreements-block">
            <!-- ko foreach: $parent.getRegion('before-place-order') -->
            <!-- ko template: getTemplate() --><!-- /ko -->
            <!--/ko-->
        </div>

        <!-- ko if: popupNotice() -->
        <div class="message notice aplazo-popup-notice" role="status" aria-live="polite">
            <span data-bind="text: popupNotice()"></span>
        </div>
        <!-- /ko -->
        <!-- ko if: popupCanReopen() -->
        <div class="actions-toolbar aplazo-popup-reopen">
            <div class="primary">
                <button class="action secondary" type="button" data-bind="click: reopenPopup">
                    <span>Reabrir Aplazo</span>
                </button>
            </div>
        </div>
        <!-- /ko -->

        <div class="actions-toolbar">
            <div class="primary">
                <button class="action primary checkout"
                        type="submit"
                        data-bind="
                        click: placeOrder,
                        enable: !popupOrderPlaced(),
                        attr: {title: $t('Place Order')}
                        ">
                    <span data-bind="i18n: 'Place Order'"></span>
                </button>
            </div>
        </div>
    </div>
</div>
